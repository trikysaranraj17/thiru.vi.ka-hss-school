  <header class="page-header" id="main-content">
    <div class="orb" style="top: 20%; left: 10%; background: radial-gradient(circle, var(--color-gold-vivid) 0%, transparent 70%); opacity: 0.15;"></div>
    <div class="container" style="position: relative; z-index: 2; text-align: center;">
      <h1 class="page-header__title reveal" data-i18n-html="gallery.title_full">Our <span>Gallery</span></h1>
      <p class="page-header__desc reveal" style="transition-delay: 0.1s;" data-i18n="gallery.desc">
        A visual journey through our campus, events, and unforgettable moments at Thiru.Vi.Ka.
      </p>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="gallery-filters reveal" style="display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-8);">
        <button class="filter-btn btn btn--outline active" data-filter="all" data-i18n="gallery.all">All Media</button>
        <button class="filter-btn btn btn--outline" data-filter="photos" data-i18n="gallery.photos">Photos</button>
        <button class="filter-btn btn btn--outline" data-filter="videos" data-i18n="gallery.videos">Videos</button>

        <button class="filter-btn btn btn--outline" data-filter="gallery_sports" data-i18n="gallery.sports">Sports</button>

      </div>
      <div class="grid--media" id="gallery-grid">

      </div>
